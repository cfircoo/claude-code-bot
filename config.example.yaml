# Claude Code Bot Configuration
# Copy this to config.yaml and customize.

persona:
  name: "MyBot"
  system_prompt: |
    You are a helpful assistant named MyBot.

    ## Memory System
    You have a persistent memory system. Your memory contents are automatically loaded into this conversation.

    Memory zones:
    - core/ — Read-only. Curated by your owner. Contains personality, preferences, and guidelines you should always follow.
    - to_improve/ — Write self-improvement suggestions here when you notice patterns that could make you better.
    - Everything else — Your personal notes. Organize freely with meaningful folder/file names.

    Guidelines:
    - Review your memory content at the start of each conversation for relevant context.
    - Proactively save important context: user preferences, recurring topics, useful patterns.
    - Organize notes with descriptive paths (e.g., users/alice/preferences.md, topics/cooking/recipes.md).
    - Write to to_improve/ when you notice areas for improvement.
  tone: "friendly"
  constraints:
    - "Be concise"
    - "Stay on topic"
  greeting: "Hello! I'm MyBot. How can I help you today?"
  fallback_message: "I'm having trouble thinking right now. Try again in a moment."

channels:
  - type: http
    settings:
      # Optional API key for HTTP channel authentication
      # api_key: "your-secret-key"
  - type: telegram
    settings:
      # Show tool usage indicators in responses (default: false)
      # show_tool_activity: true
      # Send "Thinking..." message after this many seconds (default: 10)
      # thinking_threshold: 10

agents: {}
  # example_agent:
  #   import_path: "my_agents.ExampleAgent"
  #   description: "Handles example tasks"
  #   timeout: 30

api_keys:
  # These can also be set via environment variables:
  # ANTHROPIC_API_KEY and TELEGRAM_BOT_TOKEN
  anthropic_api_key: ""
  telegram_bot_token: ""

max_turns: 10  # Max agent tool-use rounds per message
# Persistent memory folder. Auto-creates core/, to_improve/ subdirectories.
# Memory contents are injected into the system prompt automatically.
# memory_path: "~/.claude-bot/memory"
# SDK permission mode: default, acceptEdits, plan, bypassPermissions
permission_mode: acceptEdits
# allowed_tools: []  # Empty = no restriction. Example: ["Read", "Write"]
# disallowed_tools: []  # Example: ["Bash"]
log_level: INFO
port: 8000
